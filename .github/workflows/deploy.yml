name: Deploy site (HTML + Quartz garden) to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Quartz can derive note dates from git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('quartz/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Build Quartz garden (from the "Second Throat" vault)
        working-directory: quartz
        run: npx quartz build -d "../Second Throat" -o public

      - name: Assemble site (root HTML at /, Quartz garden at /garden)
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # Copy the hand-written site to the root, excluding tooling and the raw vault.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'quartz' \
            --exclude 'dist' \
            --exclude '.DS_Store' \
            --exclude 'Second Throat' \
            ./ dist/
          # Place the built garden under /garden
          mkdir -p dist/garden
          cp -R quartz/public/. dist/garden/
          # Sanity checks
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/garden/index.html
          echo "Assembled site:"
          ls dist
          echo "Garden:"
          ls dist/garden | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
