name: Deploy site (HTML + Quartz gardens) to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Quartz can derive note dates from git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('quartz/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Build all gardens (everything under gardens/)
        working-directory: quartz
        run: npx quartz build -d "../gardens" -o public

      - name: Assemble site (root HTML at /, gardens at /gardens)
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # Copy the hand-written site to the root, excluding tooling and the
          # raw gardens source (the built version is placed under /gardens below).
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'quartz' \
            --exclude 'scripts' \
            --exclude 'gardens' \
            --exclude 'dist' \
            --exclude '.DS_Store' \
            ./ dist/
          # Place the built gardens under /gardens
          mkdir -p dist/gardens
          cp -R quartz/public/. dist/gardens/
          # Sanity checks
          test -f dist/index.html          # hand-written homepage
          test -f dist/CNAME               # custom domain preserved
          test -f dist/gardens/index.html  # gardens landing page
          echo "Assembled site root:"
          ls dist
          echo "Gardens:"
          ls dist/gardens | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
