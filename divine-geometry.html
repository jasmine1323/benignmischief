<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060907">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <title>Divine Geometry — Benign Mischief</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* full-screen canvas app: override the shared body padding */
        body { padding: 0; overflow: hidden; }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(4px);
        }
        .header h1 {
            font-size: 1em; font-weight: 700; letter-spacing: 0.14em;
            color: var(--phos-bright); text-shadow: var(--glow);
        }
        .header .links { display: flex; gap: 16px; font-size: 0.85em; }
        .header a { color: var(--text-dim); text-decoration: none; }
        .header a:hover { color: var(--phos-bright); text-shadow: var(--glow); }

        .canvas { position: absolute; top: 54px; left: 0; right: 0; bottom: 0; overflow: auto; }
        .canvas-inner { position: relative; min-width: 3000px; min-height: 3000px; padding: 20px; }

        .image-item { position: absolute; cursor: move; border: 2px solid transparent; border-radius: 4px; transition: border-color 0.2s, box-shadow 0.2s; }
        .image-item:hover { border-color: var(--phos); box-shadow: var(--glow); }
        .image-item:hover .image-name { opacity: 1; }
        .image-item.dragging { opacity: 0.75; border-color: var(--phos-bright); box-shadow: var(--glow); }
        .image-item img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }

        .image-name {
            position: absolute; top: -26px; left: 0;
            background: var(--phos); color: var(--ink);
            padding: 3px 8px; font-size: 0.78em; white-space: nowrap;
            opacity: 0; transition: opacity 0.2s; pointer-events: none; border-radius: 3px;
        }

        .resize-handle { position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: transparent; cursor: default; z-index: 10; transition: background 0.2s, cursor 0.2s; }
        .resize-handle:hover { background: var(--phos); cursor: nwse-resize; }

        .controls {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 12px; backdrop-filter: blur(4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls button {
            font-family: var(--mono); padding: 8px 14px; margin: 4px;
            border: 1px solid var(--line); border-radius: 5px;
            background: rgba(87,240,138,0.05); color: var(--phos); cursor: pointer;
            letter-spacing: 0.06em; transition: all 0.18s;
        }
        .controls button:hover { background: var(--phos); color: var(--ink); box-shadow: var(--glow); border-color: var(--phos); }

        .hint {
            position: fixed; bottom: 24px; left: 20px; z-index: 100;
            color: var(--text-dim); font-size: 0.78em; opacity: 0.7; letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⟁ DIVINE GEOMETRY</h1>
        <div class="links">
            <a href="drawing.html">← drawing</a>
            <a href="/">home</a>
        </div>
    </div>

    <div class="canvas" id="canvas">
        <div class="canvas-inner" id="canvas-inner">
            <!-- Images will be placed here -->
        </div>
    </div>

    <div class="hint">drag to move · corner to resize</div>

    <div class="controls">
        <button onclick="snapToGrid()">[ snap to grid ]</button>
        <button onclick="resetPositions()">[ reset ]</button>
    </div>

    <script>
        // ========================================
        // IMAGE DATA — add image paths here
        // ========================================
        const images = [
            "drawings_images/divine_geometry/entryway.jpg",
            "drawings_images/divine_geometry/yogurt.jpg"
        ];
        // ========================================

        const GRID_SIZE = 50;
        let draggedElement = null;
        let resizingElement = null;
        let offsetX, offsetY;
        let initialPositions = [];
        let initialSizes = [];
        let zIndexCounter = 1;

        function initImages() {
            const container = document.getElementById('canvas-inner');
            images.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'image-item';
                item.style.zIndex = zIndexCounter++;

                const img = document.createElement('img');
                img.src = src;
                img.alt = `Image ${index + 1}`;

                const filename = src.split('/').pop();
                const imageName = document.createElement('div');
                imageName.className = 'image-name';
                imageName.textContent = filename;

                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'resize-handle';

                item.appendChild(imageName);
                item.appendChild(img);
                item.appendChild(resizeHandle);

                const x = 100 + (index % 4) * 450;
                const y = 100 + Math.floor(index / 4) * 350;
                item.style.left = x + 'px';
                item.style.top = y + 'px';

                img.onload = function () {
                    const width = img.naturalWidth, height = img.naturalHeight;
                    const maxWidth = 600, maxHeight = 600;
                    let finalWidth = width, finalHeight = height;
                    if (width > maxWidth || height > maxHeight) {
                        const scale = Math.min(maxWidth / width, maxHeight / height);
                        finalWidth = width * scale;
                        finalHeight = height * scale;
                    }
                    item.style.width = finalWidth + 'px';
                    item.style.height = finalHeight + 'px';
                    if (!initialSizes[index]) initialSizes[index] = { width: finalWidth, height: finalHeight };
                };

                initialPositions.push({ x, y });
                item.addEventListener('mousedown', startDrag);
                resizeHandle.addEventListener('mousedown', startResize);
                container.appendChild(item);
            });
        }

        function startDrag(e) {
            if (e.target.classList.contains('resize-handle')) return;
            draggedElement = e.currentTarget;
            draggedElement.classList.add('dragging');
            draggedElement.style.zIndex = zIndexCounter++;
            const rect = draggedElement.getBoundingClientRect();
            const canvas = document.getElementById('canvas');
            offsetX = e.clientX - rect.left + canvas.scrollLeft;
            offsetY = e.clientY - rect.top + canvas.scrollTop;
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
        }
        function drag(e) {
            if (!draggedElement) return;
            const canvas = document.getElementById('canvas');
            draggedElement.style.left = (e.clientX - offsetX + canvas.scrollLeft) + 'px';
            draggedElement.style.top = (e.clientY - offsetY + canvas.scrollTop) + 'px';
        }
        function stopDrag() {
            if (draggedElement) { draggedElement.classList.remove('dragging'); draggedElement = null; }
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }
        function startResize(e) {
            e.stopPropagation();
            resizingElement = e.target.parentElement;
            const rect = resizingElement.getBoundingClientRect();
            offsetX = rect.left; offsetY = rect.top;
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);
        }
        function resize(e) {
            if (!resizingElement) return;
            const canvas = document.getElementById('canvas');
            const newWidth = e.clientX - offsetX + canvas.scrollLeft;
            const newHeight = e.clientY - offsetY + canvas.scrollTop;
            if (newWidth > 50) resizingElement.style.width = newWidth + 'px';
            if (newHeight > 50) resizingElement.style.height = newHeight + 'px';
        }
        function stopResize() {
            resizingElement = null;
            document.removeEventListener('mousemove', resize);
            document.removeEventListener('mouseup', stopResize);
        }
        function snapToGrid() {
            document.querySelectorAll('.image-item').forEach(item => {
                const x = parseInt(item.style.left), y = parseInt(item.style.top);
                item.style.left = Math.round(x / GRID_SIZE) * GRID_SIZE + 'px';
                item.style.top = Math.round(y / GRID_SIZE) * GRID_SIZE + 'px';
            });
        }
        function resetPositions() {
            document.querySelectorAll('.image-item').forEach((item, index) => {
                const pos = initialPositions[index], size = initialSizes[index];
                if (pos) { item.style.left = pos.x + 'px'; item.style.top = pos.y + 'px'; }
                if (size) { item.style.width = size.width + 'px'; item.style.height = size.height + 'px'; }
            });
        }

        initImages();
    </script>
</body>
</html>
