<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060907">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <title>Snake — Benign Mischief</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="site-bar">
        <a class="brand" href="/">benign://mischief</a>
        <a href="/games/">← arcade</a>
        <a href="/games/typing.html">typing</a>
        <a href="/games/2048.html">2048</a>
        <a href="/games/tetris.html">tetris</a>
    </nav>

    <div class="container">
        <div class="window-bar">
            <span class="dots"><i></i><i></i><i></i></span>
            <span>benign://mischief</span>
            <span class="path">~ /games/snake</span>
        </div>
        <div class="window-body">
            <header>
                <a class="crumb" href="/games/">← arcade</a>
                <h1 class="title">@ SNAKE</h1>
                <p class="subtitle">fixed speed, fair for everyone · arrow keys or WASD</p>
            </header>

            <div class="game-layout">
                <div class="game-panel">
                    <div class="hud">
                        <div><span class="label">SCORE</span><span class="score" id="score">0</span></div>
                        <div style="text-align:right"><span class="label">BEST</span><span class="status" id="best">0</span></div>
                    </div>

                    <div class="canvas-wrap">
                        <canvas id="board" class="game-canvas" width="480" height="480"></canvas>
                        <div class="game-over" id="over">
                            <div class="big" id="over-title">game over</div>
                            <div class="final">score: <span id="final">0</span></div>
                            <input type="text" id="name" maxlength="20" placeholder="enter your name" autocomplete="off">
                            <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                                <button class="btn amber" id="submit">submit score</button>
                                <button class="btn" id="again">play again</button>
                            </div>
                        </div>
                    </div>

                    <div class="game-controls">
                        <button class="btn" id="start">▶ start</button>
                        <label class="swatch">snake <input type="color" id="snake-color" value="#57f08a"></label>
                        <label class="swatch">bg <input type="color" id="bg-color" value="#060907"></label>
                        <span class="hint">space to start / pause</span>
                    </div>

                    <div class="dpad">
                        <button class="up" data-dir="up">↑</button>
                        <button class="left" data-dir="left">←</button>
                        <button class="right" data-dir="right">→</button>
                        <button class="down" data-dir="down">↓</button>
                    </div>
                </div>

                <div class="leaderboard">
                    <h2>◈ TOP 10 · SNAKE</h2>
                    <ul class="lb-list" id="lb-list"></ul>
                    <p class="lb-note" id="lb-note"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="leaderboard.js"></script>
    <script>
    (() => {
        const GAME = 'snake';
        const N = 24;                 // grid cells per side
        const TICK = 110;             // ms per step — FIXED for fairness
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const cell = canvas.width / N;

        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overEl = document.getElementById('over');
        const finalEl = document.getElementById('final');
        const nameEl = document.getElementById('name');
        const startBtn = document.getElementById('start');
        const listEl = document.getElementById('lb-list');
        const noteEl = document.getElementById('lb-note');

        // colors (persisted)
        const snakeInput = document.getElementById('snake-color');
        const bgInput = document.getElementById('bg-color');
        const saved = JSON.parse(localStorage.getItem('snake:colors') || '{}');
        let snakeColor = saved.snake || '#57f08a';
        let bgColor = saved.bg || '#060907';
        const FOOD = '#ffb454';
        snakeInput.value = snakeColor;
        bgInput.value = bgColor;
        snakeInput.addEventListener('input', e => { snakeColor = e.target.value; persistColors(); draw(); });
        bgInput.addEventListener('input', e => { bgColor = e.target.value; persistColors(); draw(); });
        function persistColors() { localStorage.setItem('snake:colors', JSON.stringify({ snake: snakeColor, bg: bgColor })); }

        let snake, dir, nextDir, food, score, running, timer, dead;
        let best = Number(localStorage.getItem('snake:best') || 0);
        bestEl.textContent = best;

        function reset() {
            snake = [{ x: 10, y: 12 }, { x: 9, y: 12 }, { x: 8, y: 12 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0; dead = false;
            scoreEl.textContent = 0;
            spawnFood();
            draw();
        }
        function spawnFood() {
            do {
                food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function step() {
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            // walls are deadly (fairness + challenge)
            if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                return gameOver();
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 1;
                scoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function draw() {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // subtle grid
            ctx.strokeStyle = 'rgba(87,240,138,0.05)';
            ctx.lineWidth = 1;
            for (let i = 1; i < N; i++) {
                ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
            }
            // food
            ctx.fillStyle = FOOD;
            ctx.shadowColor = FOOD; ctx.shadowBlur = 12;
            ctx.fillRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6);
            ctx.shadowBlur = 0;
            // snake
            snake.forEach((s, i) => {
                ctx.fillStyle = snakeColor;
                ctx.globalAlpha = i === 0 ? 1 : Math.max(0.55, 1 - i / (snake.length * 1.4));
                ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
            });
            ctx.globalAlpha = 1;
        }

        function start() {
            if (dead) reset();
            if (running) return;
            running = true;
            startBtn.textContent = '⏸ pause';
            overEl.classList.remove('show');
            timer = setInterval(step, TICK);
        }
        function pause() {
            running = false;
            startBtn.textContent = '▶ start';
            clearInterval(timer);
        }
        function toggle() { running ? pause() : start(); }

        function gameOver() {
            running = false; dead = true;
            clearInterval(timer);
            startBtn.textContent = '▶ start';
            if (score > best) { best = score; localStorage.setItem('snake:best', best); bestEl.textContent = best; }
            finalEl.textContent = score;
            nameEl.value = localStorage.getItem('player:name') || '';
            overEl.classList.add('show');
            nameEl.focus();
        }

        // input
        const DIRS = {
            up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
        };
        function setDir(d) {
            const nd = DIRS[d]; if (!nd) return;
            // no 180° reversal
            if (nd.x === -dir.x && nd.y === -dir.y) return;
            nextDir = nd;
        }
        document.addEventListener('keydown', (e) => {
            const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
            if (e.key === ' ') { e.preventDefault(); toggle(); return; }
            const d = map[e.key];
            if (d) {
                e.preventDefault();
                if (!running && !dead) start();
                setDir(d);
            }
        });
        document.querySelectorAll('.dpad button').forEach(b => {
            b.addEventListener('click', () => { if (!running && !dead) start(); setDir(b.dataset.dir); });
        });
        // swipe
        let tsx = 0, tsy = 0;
        canvas.addEventListener('touchstart', e => { const t = e.touches[0]; tsx = t.clientX; tsy = t.clientY; }, { passive: true });
        canvas.addEventListener('touchend', e => {
            const t = e.changedTouches[0]; const dx = t.clientX - tsx, dy = t.clientY - tsy;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
            if (!running && !dead) start();
            setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        }, { passive: true });

        startBtn.addEventListener('click', toggle);
        document.getElementById('again').addEventListener('click', () => { reset(); start(); });
        document.getElementById('submit').addEventListener('click', async () => {
            const name = Leaderboard.cleanName(nameEl.value);
            localStorage.setItem('player:name', name);
            await Leaderboard.submit(GAME, name, score);
            overEl.classList.remove('show');
            Leaderboard.render(GAME, listEl);
        });

        noteEl.textContent = Leaderboard.isRemote() ? 'live shared leaderboard' : 'saved on this device until the shared leaderboard is connected';
        Leaderboard.render(GAME, listEl);
        reset();
    })();
    </script>
</body>
</html>
