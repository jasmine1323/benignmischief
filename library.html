<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060907">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <title>Library — Benign Mischief</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .container { max-width: 1080px; }

        /* controls (sort) */
        .controls {
            margin: 0 0 26px;
            padding: 12px 14px;
            background: var(--phos-faint);
            border: 1px solid var(--line-faint);
            border-radius: 6px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            font-size: 0.85em; color: var(--text-dim);
        }
        .controls label { color: var(--amber); letter-spacing: 0.14em; font-weight: 700; }
        .controls select {
            padding: 6px 10px; font-family: var(--mono); font-size: 0.9em;
            border: 1px solid var(--line); border-radius: 4px;
            background: var(--bg-solid); color: var(--phos); cursor: pointer;
        }

        /* bookshelf — a warm wooden object sitting in the terminal */
        .bookshelf {
            position: relative;
            margin-bottom: 30px;
            padding: 20px 10px 40px 10px;
            background:
                radial-gradient(ellipse 120px 50px at 18% 25%, rgba(139, 115, 85, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse 100px 45px at 42% 65%, rgba(107, 86, 68, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse 95px 42px at 68% 30%, rgba(139, 115, 85, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse 85px 38px at 88% 72%, rgba(122, 101, 69, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse 110px 48px at 12% 82%, rgba(107, 86, 68, 0.5) 0%, transparent 50%),
                repeating-linear-gradient(92deg, transparent 0px, rgba(60, 48, 35, 0.18) 1px, transparent 2px, transparent 15px),
                linear-gradient(to bottom, #6f5a41 0%, #56422e 50%, #4a3728 100%);
            border-radius: 5px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.35);
            min-height: 300px; height: auto;
            display: flex; align-items: flex-end; align-content: flex-end; gap: 5px; flex-wrap: wrap;
        }
        .bookshelf::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 15px;
            background: linear-gradient(to bottom, #4a3728 0%, #3a2b1e 100%);
            border-radius: 0 0 5px 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .book {
            position: relative; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 2px; border: 1px solid rgba(0,0,0,0.35);
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
        }
        .book:hover { transform: translateY(-15px); box-shadow: 0 0 14px rgba(87,240,138,0.5), 3px 3px 12px rgba(0,0,0,0.5); z-index: 10; }
        .book-spine {
            writing-mode: vertical-rl; text-orientation: mixed;
            padding: 10px 5px; font-size: 0.85em; font-weight: bold;
            color: rgba(255,255,255,0.92); text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .book-tooltip {
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: var(--bg-solid); color: var(--phos); border: 1px solid var(--phos-dim);
            padding: 7px 11px; border-radius: 5px; font-size: 0.82em; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; margin-bottom: 10px; z-index: 100;
            box-shadow: var(--glow);
        }
        .book:hover .book-tooltip { opacity: 1; }

        /* modal */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(2, 6, 4, 0.85); align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-panel); backdrop-filter: blur(3px);
            padding: 30px; max-width: 620px; max-height: 90vh; overflow-y: auto;
            border: 1px solid var(--line); border-radius: 8px; position: relative;
            font-family: var(--mono); color: var(--text);
            box-shadow: 0 24px 70px rgba(0,0,0,0.6), inset 0 0 50px rgba(87,240,138,0.04);
        }
        .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.5em; cursor: pointer; color: var(--text-dim); line-height: 1; }
        .modal-close:hover { color: var(--phos-bright); text-shadow: var(--glow); }
        .modal-title { font-size: 1.5em; margin-bottom: 8px; color: var(--phos-bright); text-shadow: var(--glow); font-weight: 700; letter-spacing: 0.04em; }
        .modal-author { font-size: 1.05em; color: var(--text-dim); margin-bottom: 20px; }
        .modal-details { display: flex; gap: 20px; margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--line-faint); font-size: 0.9em; color: var(--text-dim); }
        .modal-details div { flex: 1; }
        .modal-details strong { color: var(--amber); }
        .modal-annotations { background: var(--phos-faint); padding: 15px; border: 1px solid var(--line-faint); border-radius: 6px; }
        .modal-annotations h3 { font-size: 0.85em; margin-bottom: 12px; color: var(--amber); text-shadow: var(--glow-amber); letter-spacing: 0.16em; }
        .modal-annotations p { line-height: 1.7; color: var(--text); }
    </style>
</head>
<body>
    <nav class="site-bar">
        <a class="brand" href="/">benign://mischief</a>
        <a href="/art.html">art</a>
        <a href="/gardens/poems/">poetry</a>
        <a href="/gardens/">gardens</a>
        <a href="/library.html">library</a>
        <a href="/science.html">science</a>
        <a href="/links-games.html">links</a>
    </nav>

    <div class="container">
        <div class="window-bar">
            <span class="dots"><i></i><i></i><i></i></span>
            <span>benign://mischief</span>
            <span class="path">~ /library</span>
        </div>
        <div class="window-body">
            <header>
                <a class="crumb" href="/">← back to home</a>
                <h1 class="title">☰ LIBRARY</h1>
                <p class="subtitle">a shelf of books worth keeping · click a spine</p>
            </header>

            <div class="controls">
                <label for="sort-select">[ SORT ]</label>
                <select id="sort-select">
                    <option value="title">title (a-z)</option>
                    <option value="author">author (a-z)</option>
                    <option value="genre">genre (a-z)</option>
                    <option value="year">year (newest)</option>
                    <option value="year-old">year (oldest)</option>
                    <option value="random">random</option>
                </select>
            </div>

            <div id="shelves"></div>
        </div>
    </div>

    <div class="modal" id="book-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-author" id="modal-author"></div>
            <div class="modal-details">
                <div><strong>Edition:</strong> <span id="modal-edition"></span></div>
                <div><strong>Year:</strong> <span id="modal-year"></span></div>
            </div>
            <div class="modal-annotations">
                <h3>[ ANNOTATIONS ]</h3>
                <p id="modal-annotations"></p>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // GENRE COLOR PALETTE
        // ========================================
        const genreColors = {
            "Fiction": "#A68A5C", "Dystopian": "#5F7B7C", "Classic": "#A86B54",
            "Romance": "#9A7A9A", "Coming of Age": "#B88E85", "Adventure": "#6B7F94",
            "Fantasy": "#5F8A5F", "Science Fiction": "#D4A574", "Epic": "#8A7869",
            "Philosophy": "#7A6B8A", "Non-Fiction": "#B89A7A", "History": "#A68863",
            "Biography": "#9A8A79", "Mystery": "#4F6178", "Horror": "#8A5F4F",
            "Poetry": "#A594A5", "Drama": "#B89F5C"
        };

        // ========================================
        // BOOK DATA
        // ========================================
        const books = [
            { title: "The Great Gatsby", author: "F. Scott Fitzgerald", edition: "First Edition", year: 1925, genre: "Fiction", width: 45, annotations: "A masterpiece of American literature exploring themes of wealth, love, and the American Dream in the Jazz Age. Fitzgerald's prose is lyrical and his characters unforgettable." },
            { title: "1984", author: "George Orwell", edition: "Penguin Classics", year: 1949, genre: "Dystopian", width: 42, annotations: "A dystopian warning about totalitarianism that remains chillingly relevant. Orwell's vision of surveillance, propaganda, and control feels prescient in our modern age." },
            { title: "To Kill a Mockingbird", author: "Harper Lee", edition: "50th Anniversary Edition", year: 1960, genre: "Classic", width: 50, annotations: "A profound exploration of racial injustice and moral growth in the American South. Scout's perspective brings both innocence and clarity to complex themes." },
            { title: "Pride and Prejudice", author: "Jane Austen", edition: "Oxford World's Classics", year: 1813, genre: "Romance", width: 38, annotations: "Austen's wit and social commentary shine through this romance. Elizabeth Bennet remains one of literature's most beloved heroines." },
            { title: "The Catcher in the Rye", author: "J.D. Salinger", edition: "Little, Brown and Company", year: 1951, genre: "Coming of Age", width: 44, annotations: "Holden Caulfield's voice captures teenage angst and alienation perfectly. A controversial but deeply influential coming-of-age story." },
            { title: "Moby-Dick", author: "Herman Melville", edition: "Norton Critical Edition", year: 1851, genre: "Adventure", width: 55, annotations: "An epic tale of obsession and the human struggle against nature. Melville's symbolism and philosophy make this more than just a whale hunt." },
            { title: "The Hobbit", author: "J.R.R. Tolkien", edition: "Illustrated Edition", year: 1937, genre: "Fantasy", width: 40, annotations: "A delightful adventure that introduced Middle-earth. Bilbo's journey from comfort to courage resonates with readers of all ages." },
            { title: "Brave New World", author: "Aldous Huxley", edition: "Harper Perennial", year: 1932, genre: "Dystopian", width: 46, annotations: "A dystopia of pleasure and control rather than pain. Huxley's vision of a society drugged into complacency is hauntingly plausible." },
            { title: "The Lord of the Rings", author: "J.R.R. Tolkien", edition: "50th Anniversary Edition", year: 1954, genre: "Fantasy", width: 60, annotations: "The epic fantasy that defined a genre. Tolkien's world-building and themes of friendship, sacrifice, and the corrupting nature of power are unmatched." },
            { title: "Dune", author: "Frank Herbert", edition: "Deluxe Edition", year: 1965, genre: "Science Fiction", width: 48, annotations: "A complex science fiction masterwork about ecology, religion, and politics. Herbert created a richly detailed universe that rewards multiple readings." },
            { title: "The Republic", author: "Plato", edition: "Hackett Classics", year: -380, genre: "Philosophy", width: 52, annotations: "Plato's cornerstone work on justice, the ideal state, and the nature of reality. The allegory of the cave remains one of philosophy's most enduring metaphors." },
            { title: "Meditations", author: "Marcus Aurelius", edition: "Modern Library", year: 180, genre: "Philosophy", width: 40, annotations: "The private reflections of a Roman emperor on Stoic philosophy. Timeless wisdom on virtue, mortality, and living a meaningful life." },
            { title: "The Odyssey", author: "Homer", edition: "Penguin Classics", year: -800, genre: "Epic", width: 48, annotations: "The epic journey home of Odysseus after the Trojan War. A foundational text of Western literature filled with adventure, gods, and human perseverance." },
            { title: "Frankenstein", author: "Mary Shelley", edition: "Dover Thrift", year: 1818, genre: "Horror", width: 42, annotations: "The birth of science fiction and a gothic masterpiece. Shelley's tale of creation and responsibility remains hauntingly relevant." },
            { title: "The Brothers Karamazov", author: "Fyodor Dostoevsky", edition: "Vintage Classics", year: 1880, genre: "Fiction", width: 58, annotations: "Dostoevsky's final masterpiece exploring faith, doubt, morality, and free will through the complex relationships of the Karamazov family." },
            { title: "One Hundred Years of Solitude", author: "Gabriel García Márquez", edition: "Harper Perennial", year: 1967, genre: "Fiction", width: 46, annotations: "A magical realist epic chronicling the Buendía family across generations. García Márquez weaves myth and reality into an unforgettable narrative." },
            { title: "The Handmaid's Tale", author: "Margaret Atwood", edition: "Anchor Books", year: 1985, genre: "Dystopian", width: 44, annotations: "A chilling vision of a theocratic future where women are stripped of rights. Atwood's dystopia feels increasingly prescient with each passing year." },
            { title: "Sapiens", author: "Yuval Noah Harari", edition: "Harper", year: 2011, genre: "Non-Fiction", width: 50, annotations: "A sweeping history of humankind from the Stone Age to the present. Harari examines how Homo sapiens came to dominate the world." },
            { title: "The Iliad", author: "Homer", edition: "Penguin Classics", year: -750, genre: "Epic", width: 50, annotations: "The epic tale of the Trojan War, centered on the wrath of Achilles. Homer's masterpiece of heroism, honor, and the human condition." },
            { title: "Crime and Punishment", author: "Fyodor Dostoevsky", edition: "Vintage Classics", year: 1866, genre: "Fiction", width: 54, annotations: "A psychological thriller exploring guilt, redemption, and morality. Raskolnikov's descent into madness is unforgettable." }
        ];

        let currentBooks = [...books];
        function getBookColor(book) { return genreColors[book.genre] || "#8B4513"; }
        function getBookHeight(title) { return 140 + (title.length * 4.5); }

        function renderBooks() {
            const shelvesContainer = document.getElementById('shelves');
            shelvesContainer.innerHTML = '';
            const shelf = document.createElement('div');
            shelf.className = 'bookshelf';
            currentBooks.forEach(book => {
                const bookEl = document.createElement('div');
                bookEl.className = 'book';
                bookEl.style.backgroundColor = getBookColor(book);
                bookEl.style.height = getBookHeight(book.title) + 'px';
                bookEl.style.width = book.width + 'px';
                bookEl.innerHTML = `
                    <div class="book-spine">${book.title}</div>
                    <div class="book-tooltip">${book.title}<br>${book.author}</div>`;
                bookEl.onclick = () => openModal(book);
                shelf.appendChild(bookEl);
            });
            shelvesContainer.appendChild(shelf);
        }

        function openModal(book) {
            document.getElementById('modal-title').textContent = book.title;
            document.getElementById('modal-author').textContent = book.author;
            document.getElementById('modal-edition').textContent = book.edition;
            document.getElementById('modal-year').textContent = book.year;
            document.getElementById('modal-annotations').textContent = book.annotations;
            document.getElementById('book-modal').classList.add('active');
        }
        function closeModal() { document.getElementById('book-modal').classList.remove('active'); }
        document.getElementById('book-modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        document.getElementById('sort-select').addEventListener('change', function (e) {
            const sortType = e.target.value;
            switch (sortType) {
                case 'title': currentBooks.sort((a, b) => a.title.localeCompare(b.title)); break;
                case 'author': currentBooks.sort((a, b) => a.author.localeCompare(b.author)); break;
                case 'genre': currentBooks.sort((a, b) => a.genre.localeCompare(b.genre)); break;
                case 'year': currentBooks.sort((a, b) => b.year - a.year); break;
                case 'year-old': currentBooks.sort((a, b) => a.year - b.year); break;
                case 'random': currentBooks.sort(() => Math.random() - 0.5); break;
            }
            renderBooks();
        });

        renderBooks();
    </script>
</body>
</html>
